# Configuration used for every result reported in the manuscript (Figures 3-4, Tables 3, 7, 8).
# The filters follow the manuscript's "Filters" paragraph: 50/100 Hz IIR notches (Q = 20), a
# second-order Butterworth 0.5-150 Hz band-pass for the feature signal, and a separate second-order
# Butterworth 30 Hz low-pass for the morphology signal.
# Values that differ from the package defaults (PipelineConfig()) are marked "override".
ecg_base_path: ./data
annotations_dir: ./data  # dir used if both csv and dir are specified
#annotations_csv: ./data/annotations.csv

debug: false

annotations:
  boundary_mode: cross_lead  # "cross_lead" (default) or "per_lead"

pipeline:
  group_tolerance_ms: 200

  signal_preprocessor_config:
    lowcut: 0.5
    highcut: 150
    order: 2
    notch_freq: [50.0, 100.0]
    quality_factor: 20.0
    normalization_type: none
    global_baseline_mode: none  # "none" or "p_onset_spline"
    global_baseline_smoothing_factor: 0

  morphology_preprocessor_config:
    lowcut: null  # low-pass only
    highcut: 30
    order: 2
    notch_freq: [50.0, 100.0]
    quality_factor: 20.0
    normalization_type: none
    global_baseline_mode: none  # "none" or "p_onset_spline"
    global_baseline_smoothing_factor: 0

  segment_config:
    baseline_correction_type: onset  # override (package default: none); "none", "linear", or "onset"
    skip_first_ms: 0

  feature_computation:
    # Entropy
    shannon_entropy_n_bins: 128  # override (package default: 32)
    shannon_entropy_bin_range: [-0.5, 0.5]  # override (package default: per-beat min/max), in mV; twice the upper limit of normal P-wave amplitude
    sample_entropy_m: 2
    sample_entropy_r_factor: 0.25
    # Complexity
    extrema_threshold_multiplier: 0.1
    # Noise & morphology
    noise_sd_multiplier: 3.0
    morphology_min_phase_fraction: 0.1
    morphology_noise_sd_multiplier: 3.0
    # PTF
    ptf_zero_crossing: false  # true = conventional zero-crossing PTF (unsupervised only)
    # Dispersion
    dispersion_per_beat: true  # false = one max - min over all beats of the recording instead of per beat
    # Fragmentation
    min_fragment_length_ms: 10.0
    normalize_by_duration: false

run:
  cache_dir: ../outputs/cache
